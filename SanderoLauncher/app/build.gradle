plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.sandero.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "fr.sandero.launcher"
        minSdk 21
        // Android 8.1 sur l'autoradio : on cible 27 pour éviter les restrictions récentes.
        targetSdk 27
        versionCode 12
        versionName "0.12"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
