plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.sandero.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "fr.sandero.launcher"
        minSdk 21
        // Android 8.1 sur l'autoradio : on cible 27 pour éviter les restrictions récentes.
        targetSdk 27
        versionCode 23
        versionName "0.23"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Après chaque compilation debug : copie dans release/Sandero_VXXX.apk (XXX = versionCode sur 3 chiffres).
def sanderoApkName = String.format('Sandero_V%03d.apk', android.defaultConfig.versionCode)
tasks.register('copySanderoApk', Copy) {
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into rootProject.file('../release')
    rename { sanderoApkName }
}
afterEvaluate {
    tasks.named('assembleDebug') { finalizedBy 'copySanderoApk' }
}
