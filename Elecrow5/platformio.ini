; Elecrow CrowPanel 5.0" ESP32-S3 HMI (SKU DIS07050H) : 800x480 RGB, tactile GT911.
; Framework ESP-IDF 5.5 (pas Arduino 2.x) : son pilote RGB a le « bounce buffer »,
; indispensable pour une interface fluide (voir README.md).

; ATTENTION : ESP-IDF ne compile pas sous un chemin avec espace (« SOFT SANDERO »),
; même avec build_dir déplacé (le compilateur casse aussi). Les boutons PlatformIO de
; VS Code échouent donc ici : utiliser Flasher.bat / Compiler.bat (lecteur virtuel).

[env:elecrow5]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf

; Module ESP32-S3-WROOM-1-N4R8 : 4 Mo de flash, 8 Mo de PSRAM octale.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
